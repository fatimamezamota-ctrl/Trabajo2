<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Captura de Datos</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --success: #10b981;
      --success-hover: #059669;
      --warning: #f59e0b;
      --warning-hover: #d97706;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --border-color: #e5e7eb;
      --radius: 12px;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* Card principal */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 2rem;
      border: 1px solid var(--border-color);
    }

    .header {
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1rem;
    }

    .header h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Grid del formulario */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.25rem;
      margin-bottom: 1.5rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    label {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-main);
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 0.65rem 0.85rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
      background-color: #fafafa;
    }

    input[type="text"]:focus,
    input[type="number"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
      background-color: #fff;
    }

    /* Grupo de Botones */
    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    button {
      padding: 0.65rem 1.25rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      filter: grayscale(50%);
    }

    /* Estilos específicos de botones */
    #btnRegistrar {
      background-color: var(--success);
      color: white;
    }
    #btnRegistrar:hover:not(:disabled) {
      background-color: var(--success-hover);
    }

    #btnConsultar {
      background-color: var(--primary);
      color: white;
    }
    #btnConsultar:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    #btnModificar {
      background-color: var(--warning);
      color: white;
    }
    #btnModificar:hover:not(:disabled) {
      background-color: var(--warning-hover);
    }

    #btnEliminar {
      background-color: var(--danger);
      color: white;
    }
    #btnEliminar:hover:not(:disabled) {
      background-color: var(--danger-hover);
    }

    #btnCerrar {
      background-color: #6b7280;
      color: white;
    }
    #btnCerrar:hover {
      background-color: #4b5563;
    }

    /* Estado / Mensajes */
    #estado {
      margin-top: 1rem;
      font-weight: 500;
      font-size: 0.9rem;
      color: var(--primary);
      min-height: 1.2rem;
    }

    /* Sección Tabla */
    #seccionTabla {
      display: none;
    }

    .table-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    #buscador {
      max-width: 320px;
    }

    .table-container {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border-color);
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    thead {
      background-color: #f9fafb;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      padding: 0.75rem 1rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
    }

    td {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-main);
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    tbody tr:hover {
      background-color: #f9fafb;
    }

    .table-actions {
      display: flex;
      gap: 0.5rem;
    }

    .table-actions button {
      padding: 0.35rem 0.65rem;
      font-size: 0.8rem;
    }

    .table-actions button:first-child {
      background-color: #e0e7ff;
      color: var(--primary);
    }
    .table-actions button:first-child:hover {
      background-color: #c7d2fe;
    }

    .table-actions button:last-child {
      background-color: #fee2e2;
      color: var(--danger);
    }
    .table-actions button:last-child:hover {
      background-color: #fecaca;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Formulario Principal -->
    <div class="card">
      <div class="header">
        <h2>📋 Captura de Datos</h2>
      </div>

      <form id="formulario">
        <input type="hidden" id="id">

        <div class="form-grid">
          <div class="form-group">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" required placeholder="Ej. Ana García">
          </div>

          <div class="form-group">
            <label for="edad">Edad</label>
            <input type="number" id="edad" required min="1" max="120" placeholder="Ej. 28">
          </div>

          <div class="form-group">
            <label for="cargo">Cargo</label>
            <input type="text" id="cargo" required placeholder="Ej. Desarrolladora">
          </div>

          <div class="form-group">
            <label for="correo">Correo Electrónico</label>
            <input type="text" id="correo" required placeholder="correo@ejemplo.com">
          </div>

          <div class="form-group full-width">
            <label for="telefono">Teléfono</label>
            <input type="number" id="telefono" required min="1" max="1000000000" placeholder="Ej. 5551234567">
          </div>
        </div>

        <div class="button-group">
          <button type="button" id="btnRegistrar">Registrar</button>
          <button type="button" id="btnConsultar">Consultar</button>
          <button type="button" id="btnModificar">Modificar</button>
          <button type="button" id="btnEliminar">Eliminar</button>
        </div>
      </form>

      <p id="estado"></p>
    </div>

    <!-- Sección Tabla -->
    <div id="seccionTabla" class="card">
      <div class="header">
        <h2>📊 Registros Encontrados</h2>
      </div>

      <div class="table-controls">
        <input type="text" id="buscador" placeholder="🔍 Buscar por nombre...">
        <button type="button" id="btnCerrar">Cerrar tabla</button>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Nombre</th>
              <th>Edad</th>
              <th>Cargo</th>
              <th>Correo</th>
              <th>Teléfono</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    var URL_SCRIPT = "https://script.google.com/macros/s/AKfycbyx0lR3kZkr5B2Ebtg0jW0B0YctCFeW8iTxuPIJiuDLBOqgeqOMvl7Hz-divoaahL3t/exec";
    var registros = [];
    var tablaVisible = false;

    //  Enviar datos al script 
    function enviar(datos) {
      return fetch(URL_SCRIPT, {
        method: "POST",
        body: new URLSearchParams(datos)
      }).then(function (r) { return r.json(); });
    }

    //  Botones activos según el estado 
    function actualizarBotones() {
      var hayRegistro = document.getElementById("id").value !== "";
      document.getElementById("btnRegistrar").disabled = hayRegistro;
      document.getElementById("btnModificar").disabled = !hayRegistro;
      document.getElementById("btnEliminar").disabled = !hayRegistro;
    }

    function limpiarFormulario() {
      document.getElementById("formulario").reset();
      document.getElementById("id").value = "";
      actualizarBotones();
    }

    // funcion REGISTRAR 
    document.getElementById("btnRegistrar").onclick = function () {
      if (!document.getElementById("formulario").reportValidity()) return;

      document.getElementById("estado").textContent = "Guardando...";
      enviar({
        accion: "guardar",
        nombre: document.getElementById("nombre").value,
        edad: document.getElementById("edad").value,
        cargo: document.getElementById("cargo").value,
        correo: document.getElementById("correo").value,
        telefono: document.getElementById("telefono").value
      }).then(function (respuesta) {
        terminarAccion(respuesta, "¡Registro guardado!");
      });
    };

    // funcion de CONSULTAR 
    document.getElementById("btnConsultar").onclick = function () {
      document.getElementById("estado").textContent = "Consultando...";
      tablaVisible = true;
      document.getElementById("seccionTabla").style.display = "block";
      cargarRegistros(function () {
        document.getElementById("estado").textContent = "";
      }); 
    };

    function cargarRegistros(alTerminar) {
      fetch(URL_SCRIPT)
        .then(function (r) { return r.json(); })
        .then(function (datos) {
          registros = datos;
          mostrarTabla();
          if (alTerminar) alTerminar();
        });
    }

    function mostrarTabla() {
      var filtro = document.getElementById("buscador").value.trim().toLowerCase();
      var tabla = document.getElementById("tabla");
      tabla.innerHTML = "";

      registros.forEach(function (reg) {
        if (!reg.nombre.toString().toLowerCase().startsWith(filtro)) return;

        var tr = document.createElement("tr");
        agregarCelda(tr, new Date(reg.fecha).toLocaleString());

        agregarCelda(tr, reg.nombre);
        agregarCelda(tr, reg.edad);
        agregarCelda(tr, reg.cargo);
        agregarCelda(tr, reg.correo);
        agregarCelda(tr, reg.telefono);

        var td = document.createElement("td");
        td.className = "table-actions";

        var btnModificarFila = document.createElement("button");
        btnModificarFila.textContent = "Modificar";
        btnModificarFila.onclick = function () { cargarEnFormulario(reg); };

        var btnEliminarFila = document.createElement("button");
        btnEliminarFila.textContent = "Eliminar";
        btnEliminarFila.onclick = function () { eliminar(reg.id); };

        td.appendChild(btnModificarFila);
        td.appendChild(btnEliminarFila);
        tr.appendChild(td);
        tabla.appendChild(tr);
      });
    }

    function agregarCelda(fila, texto) {
      var td = document.createElement("td");
      td.textContent = texto;
      fila.appendChild(td);
    }

    document.getElementById("buscador").oninput = mostrarTabla;

    // CERRAR TABLA 
    document.getElementById("btnCerrar").onclick = function () {
      tablaVisible = false;
      document.getElementById("seccionTabla").style.display = "none";
      document.getElementById("buscador").value = "";
      document.getElementById("tabla").innerHTML = "";
    };

    // ---------- Pasar el registro al formulario ----------
    function cargarEnFormulario(reg) {
      document.getElementById("id").value = reg.id;
      document.getElementById("nombre").value = reg.nombre;
      document.getElementById("edad").value = reg.edad;
      document.getElementById("cargo").value = reg.cargo;
      document.getElementById("correo").value = reg.correo;
      document.getElementById("telefono").value = reg.telefono;

      document.getElementById("estado").textContent =
        "Modificando registro: cambia los datos y presiona Modificar";
      actualizarBotones();

      window.scrollTo(0, 0);
      document.getElementById("nombre").focus();
    }

    // ---------- MODIFICAR ----------
    document.getElementById("btnModificar").onclick = function () {
      var id = document.getElementById("id").value;

      if (id === "") {
        alert("Primero elige un registro con el botón 'Modificar'");
        return;
      }
      if (!document.getElementById("formulario").reportValidity()) return;

      document.getElementById("estado").textContent = "Modificando...";
      enviar({
        accion: "editar",
        id: id,
        nombre: document.getElementById("nombre").value,
        edad: document.getElementById("edad").value,
        cargo: document.getElementById("cargo").value,
        correo: document.getElementById("correo").value,
        telefono: document.getElementById("telefono").value
      }).then(function (respuesta) {
        terminarAccion(respuesta, "¡Registro modificado!");
      });
    };

    // Funcion para ELIMINAR 
    document.getElementById("btnEliminar").onclick = function () {
      eliminar(document.getElementById("id").value);
    };

    function eliminar(id) {
      if (!confirm("¿Seguro que quieres eliminar este registro?")) return;

      document.getElementById("estado").textContent = "Eliminando...";
      enviar({ accion: "eliminar", id: id }).then(function (respuesta) {
        terminarAccion(respuesta, "Registro eliminado");
      });
    }

    // Mensaje al terminar cualquier acción 
    function terminarAccion(respuesta, mensajeOk
